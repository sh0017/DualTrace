        const WebAudioSynth = {
            audioCtx: null,
            init() {
                if (!this.audioCtx) {
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            triggerMove() {
                if (!localState.soundEnabled) return;
                this.init();
                const osc = this.audioCtx.createOscillator();
                const gain = this.audioCtx.createGain();
                osc.connect(gain);
                gain.connect(this.audioCtx.destination);
                osc.frequency.setValueAtTime(320, this.audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(580, this.audioCtx.currentTime + 0.07);
                gain.gain.setValueAtTime(0.04, this.audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.07);
                osc.start();
                osc.stop(this.audioCtx.currentTime + 0.07);
            },
            triggerCollision() {
                if (!localState.soundEnabled) return;
                this.init();
                const osc = this.audioCtx.createOscillator();
                const gain = this.audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.connect(gain);
                gain.connect(this.audioCtx.destination);
                osc.frequency.setValueAtTime(160, this.audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(30, this.audioCtx.currentTime + 0.35);
                gain.gain.setValueAtTime(0.12, this.audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.35);
                osc.start();
                osc.stop(this.audioCtx.currentTime + 0.35);
            },
            triggerSymmetryShift() {
                if (!localState.soundEnabled) return;
                this.init();
                const osc = this.audioCtx.createOscillator();
                const gain = this.audioCtx.createGain();
                osc.type = 'triangle';
                osc.connect(gain);
                gain.connect(this.audioCtx.destination);
                osc.frequency.setValueAtTime(450, this.audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(750, this.audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.07, this.audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(this.audioCtx.currentTime + 0.4);
            },
            triggerWin() {
                if (!localState.soundEnabled) return;
                this.init();
                const baseTime = this.audioCtx.currentTime;
                const chords = [523.25, 659.25, 783.99, 1046.50];
                chords.forEach((freq, idx) => {
                    const osc = this.audioCtx.createOscillator();
                    const gain = this.audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(this.audioCtx.destination);
                    osc.frequency.setValueAtTime(freq, baseTime + idx * 0.08);
                    gain.gain.setValueAtTime(0.06, baseTime + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, baseTime + idx * 0.08 + 0.3);
                    osc.start(baseTime + idx * 0.08);
                    osc.stop(baseTime + idx * 0.08 + 0.3);
                });
            }

        function fetchRightDelta(dx, dy, currentRule) {
            switch (currentRule) {
                case "Translation": return { rdx: dx, rdy: dy };
                case "Horizontal Mirror": return { rdx: -dx, rdy: dy };
                case "Vertical Mirror": return { rdx: dx, rdy: -dy };
                case "180 Rotation": return { rdx: -dx, rdy: -dy };
                default: return { rdx: dx, rdy: dy };
            }
        }

        function isCoordinatesInList(x, y, list) {
            return list.some(cell => cell.x === x && cell.y === y);
        }

        function isWallAt(x, y, isLeft) {
            const level = levels[gameState.activeLevelIndex];
            const list = isLeft ? level.wallsLeft : level.wallsRight;
            return list.some(w => w.x === x && w.y === y);
        }

        function isTemporalGateBlocked(x, y) {
            const level = levels[gameState.activeLevelIndex];
            const gate = level.gates.find(g => g.x === x && g.y === y);
            if (!gate) return false;
            const plate = gate.openByPlate;
            const rightAtPlate = (gameState.rightCursor.x === plate.x && gameState.rightCursor.y === plate.y);
            return !rightAtPlate;
        }

        function processTraceStep(dx, dy) {
            if (gameState.statusActive || gameState.isPaused) return;

            const nextLx = gameState.leftCursor.x + dx;
            const nextLy = gameState.leftCursor.y + dy;

            const rule = gameState.activeSymmetry;
            const { rdx, rdy } = fetchRightDelta(dx, dy, rule);
            const nextRx = gameState.rightCursor.x + rdx;
            const nextRy = gameState.rightCursor.y + rdy;

            const outOfLBounds = nextLx < 0 || nextLx >= GRID_CELLS || nextLy < 0 || nextLy >= GRID_CELLS;
            const outOfRBounds = nextRx < 0 || nextRx >= GRID_CELLS || nextRy < 0 || nextRy >= GRID_CELLS;

            if (outOfLBounds || outOfRBounds) {
                triggerShatterExplosion();
                return;
            }

            if (isCoordinatesInList(nextLx, nextLy, gameState.leftPath) || isCoordinatesInList(nextRx, nextRy, gameState.rightPath)) {
                triggerShatterExplosion();
                return;
            }

            if (isWallAt(nextLx, nextLy, true) || isWallAt(nextRx, nextRy, false)) {
                triggerShatterExplosion();
                return;
            }

            if (isTemporalGateBlocked(nextLx, nextLy)) {
                triggerShatterExplosion();
                return;
            }

            gameState.leftCursor = { x: nextLx, y: nextLy };
            gameState.rightCursor = { x: nextRx, y: nextRy };
            gameState.leftPath.push({ x: nextLx, y: nextLy });
            gameState.rightPath.push({ x: nextRx, y: nextRy });

            gameState.movesCounter++;
            sk_hud_moves.textContent = gameState.movesCounter;

            const level = levels[gameState.activeLevelIndex];
            const modifier = level.modifiers.find(m => m.x === nextLx && m.y === nextLy);
            if (modifier) {
                gameState.activeSymmetry = modifier.nextSymmetry;
                sk_hud_symmetry.textContent = gameState.activeSymmetry;
                WebAudioSynth.triggerSymmetryShift();
            } else {
                WebAudioSynth.triggerMove();
            }

            const leftAchieved = nextLx === level.leftGoal.x && nextLy === level.leftGoal.y;
            const rightAchieved = nextRx === level.rightGoal.x && nextRy === level.rightGoal.y;

            if (leftAchieved && rightAchieved) {
                triggerLevelVictory();
            }
            drawFrame();
        }

        function triggerShatterExplosion() {
            WebAudioSynth.triggerCollision();
            gameState.statusActive = true;
            generateExplosionEffect();

            setTimeout(() => {

            }, 550);

            localState.completedLevels[gameState.activeLevelIndex] = true;

        function generateExplosionEffect() {
            const lc = gridToCanvasPixel(gameState.leftCursor.x, gameState.leftCursor.y, true);
            const rc = gridToCanvasPixel(gameState.rightCursor.x, gameState.rightCursor.y, false);

            for (let i = 0; i < 35; i++) {
                gameState.particles.push({
                    x: lc.x + CELL_DIMENSION / 2, y: lc.y + CELL_DIMENSION / 2,
                    vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.5) * 10,
                    color: '#00f0ff', life: 1.0, decay: 0.02 + Math.random() * 0.02, size: 3 + Math.random() * 5
                });
                gameState.particles.push({
                    x: rc.x + CELL_DIMENSION / 2, y: rc.y + CELL_DIMENSION / 2,
                    vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.5) * 10,
                    color: '#ff007f', life: 1.0, decay: 0.02 + Math.random() * 0.02, size: 3 + Math.random() * 5
                });
            }
        }

        function gridToCanvasPixel(gridX, gridY, isLeft) {
            const originX = isLeft ? leftGridOffset.x : rightGridOffset.x;
            const originY = isLeft ? leftGridOffset.y : rightGridOffset.y;
            return {
                x: originX + gridX * CELL_DIMENSION,
                y: originY + gridY * CELL_DIMENSION
            };
        }

        function canvasPixelToGrid(canvasX, canvasY) {
            // Apply inverse transformation of scale and pan
            const transformedX = (canvasX - gameState.offsetX) / gameState.scale;
            const transformedY = (canvasY - gameState.offsetY) / gameState.scale;

            if (transformedX >= leftGridOffset.x && transformedX <= leftGridOffset.x + GRID_BOX_SIZE &&
                transformedY >= leftGridOffset.y && transformedY <= leftGridOffset.y + GRID_BOX_SIZE) {
                return {
                    gridX: Math.floor((transformedX - leftGridOffset.x) / CELL_DIMENSION),
                    gridY: Math.floor((transformedY - leftGridOffset.y) / CELL_DIMENSION),
                    isLeft: true
                };
            }
            return null;
        }

        function drawGrid(originX, originY, isLeft, pathList, currentCursor, goalCoord, walls, modifiers, gates, plates) {
            ctx.save();
            ctx.strokeStyle = isLeft ? 'rgba(0, 240, 255, 0.25)' : 'rgba(255, 0, 127, 0.25)';
            ctx.lineWidth = 1.5;

            // Draw grid boxes
            for (let r = 0; r < GRID_CELLS; r++) {
                for (let c = 0; c < GRID_CELLS; c++) {
                    const gx = originX + c * CELL_DIMENSION;
                    const gy = originY + r * CELL_DIMENSION;
                    ctx.strokeRect(gx, gy, CELL_DIMENSION, CELL_DIMENSION);

                    // Background grid dots
                    ctx.fillStyle = isLeft ? 'rgba(0, 240, 255, 0.1)' : 'rgba(255, 0, 127, 0.1)';
                    ctx.fillRect(gx + CELL_DIMENSION / 2 - 2, gy + CELL_DIMENSION / 2 - 2, 4, 4);
                }
            }

            // Draw Goal
            const goalPx = gridToCanvasPixel(goalCoord.x, goalCoord.y, isLeft);
            ctx.fillStyle = isLeft ? 'rgba(0, 240, 255, 0.3)' : 'rgba(255, 0, 127, 0.3)';
            ctx.strokeStyle = isLeft ? '#00f0ff' : '#ff007f';
            ctx.lineWidth = 2;
            ctx.fillRect(goalPx.x + 6, goalPx.y + 6, CELL_DIMENSION - 12, CELL_DIMENSION - 12);
            ctx.strokeRect(goalPx.x + 6, goalPx.y + 6, CELL_DIMENSION - 12, CELL_DIMENSION - 12);
            
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 12px monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('GOAL', goalPx.x + CELL_DIMENSION / 2, goalPx.y + CELL_DIMENSION / 2);

            // Draw Walls
            walls.forEach(w => {
                const wPx = gridToCanvasPixel(w.x, w.y, isLeft);
                ctx.fillStyle = '#23283c';
                ctx.strokeStyle = '#475569';
                ctx.lineWidth = 2;
                ctx.fillRect(wPx.x + 2, wPx.y + 2, CELL_DIMENSION - 4, CELL_DIMENSION - 4);
                ctx.strokeRect(wPx.x + 2, wPx.y + 2, CELL_DIMENSION - 4, CELL_DIMENSION - 4);
            });

            // Draw Modifiers
            modifiers.forEach(m => {
                const mPx = gridToCanvasPixel(m.x, m.y, isLeft);
                ctx.fillStyle = 'rgba(234, 179, 8, 0.2)';
                ctx.strokeStyle = '#eab308';
                ctx.lineWidth = 2;
                ctx.fillRect(mPx.x + 4, mPx.y + 4, CELL_DIMENSION - 8, CELL_DIMENSION - 8);
                ctx.strokeRect(mPx.x + 4, mPx.y + 4, CELL_DIMENSION - 8, CELL_DIMENSION - 8);
                ctx.fillStyle = '#eab308';
                ctx.font = 'bold 14px sans-serif';
                ctx.fillText('âŸ²', mPx.x + CELL_DIMENSION / 2, mPx.y + CELL_DIMENSION / 2);
            });

            // Draw Plates & Gates
            if (isLeft) {
                gates.forEach(g => {
                    const gPx = gridToCanvasPixel(g.x, g.y, true);
                    ctx.fillStyle = isTemporalGateBlocked(g.x, g.y) ? 'rgba(239, 68, 68, 0.4)' : 'rgba(34, 197, 94, 0.4)';
                    ctx.strokeStyle = isTemporalGateBlocked(g.x, g.y) ? '#ef4444' : '#22c55e';
                    ctx.lineWidth = 2;
                    ctx.fillRect(gPx.x + 4, gPx.y + 4, CELL_DIMENSION - 8, CELL_DIMENSION - 8);
                    ctx.strokeRect(gPx.x + 4, gPx.y + 4, CELL_DIMENSION - 8, CELL_DIMENSION - 8);
                    ctx.fillStyle = '#fff';
                    ctx.font = '10px monospace';
                    ctx.fillText('GATE', gPx.x + CELL_DIMENSION / 2, gPx.y + CELL_DIMENSION / 2);
                });
            } else {
                plates.forEach(p => {
                    const pPx = gridToCanvasPixel(p.x, p.y, false);
                    ctx.fillStyle = 'rgba(168, 85, 247, 0.3)';
                    ctx.strokeStyle = '#a855f7';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(pPx.x + CELL_DIMENSION / 2, pPx.y + CELL_DIMENSION / 2, CELL_DIMENSION / 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.fillStyle = '#fff';
                    ctx.font = '10px monospace';
                    ctx.fillText('â—Ž', pPx.x + CELL_DIMENSION / 2, pPx.y + CELL_DIMENSION / 2);
                });
            }

            // Draw Trace Path Lines
            if (pathList.length > 1) {
                ctx.beginPath();
                const start = gridToCanvasPixel(pathList[0].x, pathList[0].y, isLeft);
                ctx.moveTo(start.x + CELL_DIMENSION / 2, start.y + CELL_DIMENSION / 2);
                for (let i = 1; i < pathList.length; i++) {
                    const pt = gridToCanvasPixel(pathList[i].x, pathList[i].y, isLeft);
                    ctx.lineTo(pt.x + CELL_DIMENSION / 2, pt.y + CELL_DIMENSION / 2);
                }
                ctx.strokeStyle = isLeft ? '#00f0ff' : '#ff007f';
                ctx.lineWidth = 4;
                ctx.shadowColor = isLeft ? '#00f0ff' : '#ff007f';
                ctx.shadowBlur = 10;
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            // Draw Current Cursor Head
            const curPx = gridToCanvasPixel(currentCursor.x, currentCursor.y, isLeft);
            ctx.fillStyle = isLeft ? '#00f0ff' : '#ff007f';
            ctx.shadowColor = isLeft ? '#00f0ff' : '#ff007f';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(curPx.x + CELL_DIMENSION / 2, curPx.y + CELL_DIMENSION / 2, CELL_DIMENSION / 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.restore();
        }

        function drawFrame() {
            ctx.clearRect(0, 0, sk_game_canvas.width, sk_game_canvas.height);

            ctx.save();
            // Apply zoom scale and panning offset transformations
            ctx.translate(gameState.offsetX, gameState.offsetY);
            ctx.scale(gameState.scale, gameState.scale);

            // Draw Background Header Box inside canvas
            ctx.fillStyle = '#151824';
            ctx.strokeStyle = '#23283c';
            ctx.lineWidth = 2;
            
            // Left Grid Container Border
            ctx.fillRect(leftGridOffset.x - 10, leftGridOffset.y - 35, GRID_BOX_SIZE + 20, GRID_BOX_SIZE + 45);
            ctx.strokeRect(leftGridOffset.x - 10, leftGridOffset.y - 35, GRID_BOX_SIZE + 20, GRID_BOX_SIZE + 45);
            
            // Right Grid Container Border
            ctx.fillRect(rightGridOffset.x - 10, rightGridOffset.y - 35, GRID_BOX_SIZE + 20, GRID_BOX_SIZE + 45);
            ctx.strokeRect(rightGridOffset.x - 10, rightGridOffset.y - 35, GRID_BOX_SIZE + 20, GRID_BOX_SIZE + 45);

            // Container Titles
            ctx.fillStyle = '#00f0ff';
            ctx.font = 'bold 16px sans-serif';
            ctx.fillText('PRIMARY TRACE (LIGHT GRID)', leftGridOffset.x, leftGridOffset.y - 12);

            ctx.fillStyle = '#ff007f';
            ctx.fillText('MIRRORED TRACE (DARK GRID)', rightGridOffset.x, rightGridOffset.y - 12);

            const level = levels[gameState.activeLevelIndex];
            
            // Render Left Grid
            drawGrid(leftGridOffset.x, leftGridOffset.y, true, gameState.leftPath, gameState.leftCursor, level.leftGoal, level.wallsLeft, level.modifiers, level.gates, level.plates);

            // Render Right Grid
            drawGrid(rightGridOffset.x, rightGridOffset.y, false, gameState.rightPath, gameState.rightCursor, level.rightGoal, level.wallsRight, [], [], level.plates);

            // Render Particles
            gameState.particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.restore();
        }

        // Particle update animation loop
        function updatePhysicsAnimation() {
            if (gameState.particles.length > 0) {
                gameState.particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= p.decay;
                    p.size = Math.max(0, p.size - 0.05);
                });
                gameState.particles = gameState.particles.filter(p => p.life > 0);
                drawFrame();
            }
            requestAnimationFrame(updatePhysicsAnimation);
        }
        requestAnimationFrame(updatePhysicsAnimation);

        let touchStartDist = 0;
        let lastTapTime = 0;
        let activeTouchesMap = new Map();

        sk_game_canvas.addEventListener('pointerdown', (e) => {
            activeTouchesMap.set(e.pointerId, { x: e.clientX, y: e.clientY });

            if (gameState.panMode || e.button === 1 || e.shiftKey || gameState.isPaused) {
                gameState.isPanning = true;
                gameState.startX = e.clientX - gameState.offsetX;
                gameState.startY = e.clientY - gameState.offsetY;
                sk_game_canvas.classList.add('panning');
                return;
            }

            // Tap & Double tap detection
            const now = Date.now();
            if (now - lastTapTime < 300) {
                // Double tap resets view or centers
                resetViewTransform();
            }
            lastTapTime = now;

            const rect = sk_game_canvas.getBoundingClientRect();
            const rawX = (e.clientX - rect.left) * (DESIGN_SIZE / rect.width);
            const rawY = (e.clientY - rect.top) * (DESIGN_SIZE / rect.height);

            const gridLoc = canvasPixelToGrid(rawX, rawY);
            if (gridLoc && gridLoc.isLeft) {
                if (gridLoc.gridX === gameState.leftCursor.x && gridLoc.gridY === gameState.leftCursor.y) {
                    gameState.isDrawing = true;
                }
            }
        });

        sk_game_canvas.addEventListener('pointermove', (e) => {
            activeTouchesMap.set(e.pointerId, { x: e.clientX, y: e.clientY });

            if (gameState.isPanning) {
                gameState.offsetX = e.clientX - gameState.startX;
                gameState.offsetY = e.clientY - gameState.startY;
                drawFrame();
                return;
            }

            if (!gameState.isDrawing || gameState.statusActive || gameState.isPaused) return;

            const rect = sk_game_canvas.getBoundingClientRect();
            const rawX = (e.clientX - rect.left) * (DESIGN_SIZE / rect.width);
            const rawY = (e.clientY - rect.top) * (DESIGN_SIZE / rect.height);

            const gridLoc = canvasPixelToGrid(rawX, rawY);
            if (gridLoc && gridLoc.isLeft) {
                const diffX = gridLoc.gridX - gameState.leftCursor.x;
                const diffY = gridLoc.gridY - gameState.leftCursor.y;

                if (Math.abs(diffX) + Math.abs(diffY) === 1) {
                    processTraceStep(diffX, diffY);
                }
            }
        });

        sk_game_canvas.addEventListener('pointerup', (e) => {
            activeTouchesMap.delete(e.pointerId);
            gameState.isDrawing = false;
            if (gameState.isPanning) {
                gameState.isPanning = false;
                sk_game_canvas.classList.remove('panning');
            }
        });

        sk_game_canvas.addEventListener('pointercancel', (e) => {
            activeTouchesMap.delete(e.pointerId);
            gameState.isDrawing = false;
            gameState.isPanning = false;
            sk_game_canvas.classList.remove('panning');
        });

        // 2-Finger Pinch Zoom support on Canvas container
        const canvasWrapper = document.getElementById('sk_canvas_wrapper');
        canvasWrapper.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                touchStartDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        }, { passive: true });

        canvasWrapper.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                const currentDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                if (touchStartDist > 0) {
                    const factor = currentDist / touchStartDist;
                    gameState.scale = Math.min(3.0, Math.max(0.6, gameState.scale * (factor > 1 ? 1.03 : 0.97)));
                    drawFrame();
                }
                touchStartDist = currentDist;
                e.preventDefault();
            }
        }, { passive: false });

        window.addEventListener('keydown', (e) => {
            // Zoom In/Out via Ctrl + / Ctrl - or Ctrl + Wheel
            if (e.ctrlKey && (e.key === '=' || e.key === '+' || e.key === '-')) {
                e.preventDefault();
                if (e.key === '=' || e.key === '+') {
                    gameState.scale = Math.min(3.0, gameState.scale + 0.15);
                } else {
                    gameState.scale = Math.max(0.6, gameState.scale - 0.15);
                }
                drawFrame();
                return;
            }

            if (gameState.currentScreen !== 'game' || gameState.statusActive || gameState.isPaused) return;

            let dx = 0, dy = 0;
            switch (e.key) {
                case 'ArrowUp': case 'w': case 'W': dy = -1; break;
                case 'ArrowDown': case 's': case 'S': dy = 1; break;
                case 'ArrowLeft': case 'a': case 'A': dx = -1; break;
                case 'ArrowRight': case 'd': case 'D': dx = 1; break;
                case 'r': case 'R': setupActiveLevel(gameState.activeLevelIndex); return;
                default: return;
            }
            e.preventDefault();
            processTraceStep(dx, dy);
        });

        // Mouse wheel zoom support
        sk_game_canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomIntensity = 0.1;
            if (e.deltaY < 0) {
                gameState.scale = Math.min(3.0, gameState.scale + zoomIntensity);
            } else {
                gameState.scale = Math.max(0.6, gameState.scale - zoomIntensity);
            }
            drawFrame();
        }, { passive: false });

        // Virtual D-Pad / Controls bindings
        sk_ctrl_up.addEventListener('click', () => processTraceStep(0, -1));
        sk_ctrl_left.addEventListener('click', () => processTraceStep(-1, 0));
        sk_ctrl_right.addEventListener('click', () => processTraceStep(1, 0));
        sk_ctrl_down.addEventListener('click', () => processTraceStep(0, 1));
        sk_ctrl_reset.addEventListener('click', () => setupActiveLevel(gameState.activeLevelIndex));
        sk_ctrl_zoomin.addEventListener('click', () => { gameState.scale = Math.min(3.0, gameState.scale + 0.2); drawFrame(); });
        sk_ctrl_zoomout.addEventListener('click', () => { gameState.scale = Math.max(0.6, gameState.scale - 0.2); drawFrame(); });
        sk_ctrl_center.addEventListener('click', resetViewTransform);
        
        sk_ctrl_pan.addEventListener('click', () => {
            gameState.panMode = !gameState.panMode;
            sk_ctrl_pan.classList.toggle('active_tool', gameState.panMode);
            sk_btn_pan_tool.textContent = gameState.panMode ? "âœ‹ Pan: On" : "âœ‹ Pan: Off";
            sk_btn_pan_tool.classList.toggle('active_tool', gameState.panMode);
        });

        sk_btn_pan_tool.addEventListener('click', () => {
            sk_ctrl_pan.click();
        });

        // Pause / Resume Toggle
        sk_btn_pause.addEventListener('click', () => {
            gameState.isPaused = !gameState.isPaused;
            if (gameState.isPaused) {
                sk_btn_pause.textContent = "â–¶ï¸ Resume";
                sk_status_title.textContent = "GAME PAUSED";
                sk_status_title.className = "sk_status_title sk_highlight";
                sk_status_subtitle.textContent = "Trace coordinate calibration halted. Resume when ready.";
                sk_status_action_btn.textContent = "RESUME GAME";
                sk_status_panel.classList.remove('sk_hidden');
            } else {
                sk_btn_pause.textContent = "â¸ï¸ Pause";
                sk_status_panel.classList.add('sk_hidden');
            }
        });

        // Draggable virtual controller handling
        let isDraggingGamepad = false;
        let gpX = 0, gpY = 0;

        sk_gamepad_drag_anchor.addEventListener('pointerdown', (e) => {
            isDraggingGamepad = true;
            gpX = e.clientX - sk_gamepad_panel.offsetLeft;
            gpY = e.clientY - sk_gamepad_panel.offsetTop;
            sk_gamepad_drag_anchor.setPointerCapture(e.pointerId);
        });

        sk_gamepad_drag_anchor.addEventListener('pointermove', (e) => {
            if (!isDraggingGamepad) return;
            let newLeft = e.clientX - gpX;
            let newTop = e.clientY - gpY;
            sk_gamepad_panel.style.left = Math.max(10, Math.min(window.innerWidth - sk_gamepad_panel.offsetWidth - 10, newLeft)) + 'px';
            sk_gamepad_panel.style.bottom = 'auto';
            sk_gamepad_panel.style.top = Math.max(10, Math.min(window.innerHeight - sk_gamepad_panel.offsetHeight - 10, newTop)) + 'px';
        });

        sk_gamepad_drag_anchor.addEventListener('pointerup', (e) => {
            isDraggingGamepad = false;
            try { sk_gamepad_drag_anchor.releasePointerCapture(e.pointerId); } catch(err){}
        });

        function renderCustomPopup(title, innerHTML) {
            sk_popup_title_node.textContent = title;
            sk_popup_body_node.innerHTML = innerHTML;
            sk_overlay_view.classList.remove('sk_hidden');
        }

        sk_popup_close_btn.addEventListener('click', () => {
            sk_overlay_view.classList.add('sk_hidden');
            if (gameState.isPaused && sk_status_title.textContent === "GAME PAUSED") {
                // keep pause overlay if paused
            }
        });

        sk_btn_levels.addEventListener('click', () => {
            let listHTML = `<div class="sk_level_grid">`;
            levels.forEach((lvl, index) => {
                const isUnlocked = localState.unlockedLevels[index];
                const isCompleted = localState.completedLevels[index];
                let cssClass = "sk_level_card";
                if (!isUnlocked) cssClass += " sk_locked";
                else if (isCompleted) cssClass += " sk_completed";
                listHTML += `<div class="${cssClass}" data-lvlidx="${index}">${lvl.id}</div>`;
            });
            listHTML += `</div>`;

            renderCustomPopup("Select Spatial Protocol", listHTML);

            const cards = sk_popup_body_node.querySelectorAll('.sk_level_card');
            cards.forEach(card => {
                card.addEventListener('click', () => {
                    const idx = parseInt(card.getAttribute('data-lvlidx'));
                    if (localState.unlockedLevels[idx]) {
                        sk_overlay_view.classList.add('sk_hidden');
                        navigateToScreen('game');
                        setupActiveLevel(idx);
                    }
                });
            });
        });

        sk_btn_scores.addEventListener('click', () => {
            let scoresHTML = `<div>`;
            levels.forEach((lvl, index) => {
                const best = localState.highScores[index];
                const record = best !== null ? `${best} steps` : "No Record Detected";
                scoresHTML += `
                    <div class="sk_score_row">
                        <span><b>LVL ${lvl.id}: ${lvl.name}</b></span>
                        <span class="sk_highlight">${record} (Par: ${lvl.par})</span>
                    </div>`;
            });
            scoresHTML += `</div>`;
            renderCustomPopup("Coordinative Records", scoresHTML);
        });

        sk_btn_settings.addEventListener('click', () => {
            const settingsHTML = `
                <div class="sk_setting_row">
                    <span class="sk_setting_label">Auditory Synthesizer Toggle</span>
                    <button class="sk_btn" id="sk_set_audio_btn">${localState.soundEnabled ? "MUTED: NO" : "MUTED: YES"}</button>
                </div>
                <p class="sk_menu_tip">Modifying configurations directly adapts gameplay responses instantly.</p>
            `;
            renderCustomPopup("System Configurations", settingsHTML);

            const sfxBtn = document.getElementById('sk_set_audio_btn');
            sfxBtn.addEventListener('click', () => {
                localState.soundEnabled = !localState.soundEnabled;
                sfxBtn.textContent = localState.soundEnabled ? "MUTED: NO" : "MUTED: YES";
                saveGameToDisk();
            });
        });

        sk_btn_info.addEventListener('click', () => {
            const guideHTML = `
                <p>Welcome to <b>Dual-Trace</b>, a co-op split-brain coordinates calibration.</p>
                <p>1. Interact by dragging on the <b>Light Grid (Left)</b> or using the D-Pad to trace paths.</p>
                <p>2. Use the âœ‹ Hand Pan tool or virtual zoom buttons (âž•/âž–, or Ctrl + / -) to inspect the 1:1 play area anytime (even when paused or before starting).</p>
                <p>3. Reach goals simultaneously while respecting symmetry rules, modifiers (âŸ²), and temporal gates (â—Ž).</p>
            `;
            renderCustomPopup("Operational Protocols", guideHTML);
        });

        sk_btn_fullscreen.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                sk_suite_container.requestFullscreen().catch(err => console.error(err));
            } else {
                document.exitFullscreen();
            }
        });

        let isPivoted = false;
        sk_btn_rotate.addEventListener('click', () => {
            isPivoted = !isPivoted;
            if (isPivoted) {
                sk_suite_container.classList.add('sk_rotated_container');
                sk_btn_rotate.textContent = "ðŸ”„ Default";
            } else {
                sk_suite_container.classList.remove('sk_rotated_container');
                sk_btn_rotate.textContent = "ðŸ”„ Pivot";
            }
            syncContainerResolution();
        });

        sk_btn_play_trigger.addEventListener('click', () => {
            navigateToScreen('game');
            setupActiveLevel(0);
        });

        sk_btn_demo.addEventListener('click', () => {
            navigateToScreen('game');
            setupActiveLevel(0);
            gameState.demoActive = true;

            const demoInputs = [
                { dx: 0, dy: -1 }, { dx: 0, dy: -1 }, { dx: 0, dy: -1 }, { dx: 0, dy: -1 }, { dx: 0, dy: -1 },
                { dx: 1, dy: 0 }, { dx: 1, dy: 0 }, { dx: 1, dy: 0 }, { dx: 1, dy: 0 }, { dx: 1, dy: 0 }
            ];

            let index = 0;
            gameState.demoIntervalId = setInterval(() => {
                if (index < demoInputs.length && !gameState.statusActive && !gameState.isPaused) {
                    processTraceStep(demoInputs[index].dx, demoInputs[index].dy);
                    index++;
                } else if (index >= demoInputs.length) {
                    clearInterval(gameState.demoIntervalId);
                    gameState.demoActive = false;
                }
            }, 350);
        });

        sk_status_action_btn.addEventListener('click', () => {
            if (gameState.isPaused && sk_status_title.textContent === "GAME PAUSED") {
                sk_btn_pause.click(); // Resume
                return;
            }

            sk_status_panel.classList.add('sk_hidden');
            if (sk_status_title.classList.contains('sk_success')) {
                if (gameState.activeLevelIndex + 1 < levels.length) {
                    setupActiveLevel(gameState.activeLevelIndex + 1);
                } else {
                    navigateToScreen('menu');
                    renderCustomPopup("COORDINATION RESTORED", `
                        <p>You have successfully decoded and solved all spatial levels.</p>
                        <p>Thank you for exploring Dual-Trace.</p>
                    `);
                }
            } else {
                setupActiveLevel(gameState.activeLevelIndex);
            }
        });

        function navigateToScreen(screenName) {
            gameState.currentScreen = screenName;
            if (gameState.demoActive) {
                clearInterval(gameState.demoIntervalId);
                gameState.demoActive = false;
            }

            sk_screen_menu.classList.add('sk_hidden');
            sk_screen_game.classList.add('sk_hidden');

            if (screenName === 'menu') {
                sk_screen_menu.classList.remove('sk_hidden');
            } else if (screenName === 'game') {
                sk_screen_game.classList.remove('sk_hidden');
                syncContainerResolution();
            }
        }
    </script>
</body>
</html>
